server {
    listen 80;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; font-src 'self' data:;" always;

    # Set the root to the location of our built React app
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Handle client-side routing for the Single Page Application (SPA)
    # If a file is not found, serve index.html instead of a 404 error.
    location / {
        try_files $uri /index.html;
    }

    # Proxy API requests to the backend service
    location /api {
        proxy_pass http://backend:8000;
    }
}